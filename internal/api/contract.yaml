openapi: 3.0.3
info:
  title: ShareTrip Contract Service API
  version: 1.0.0
  description: |
    Внешний API Contract Service для управления договорными условиями
    компаний и проверки доступности услуг.

servers:
  - url: http://localhost:8082/api

tags:
  - name: Contracts
    description: Управление договорами
  - name: Services
    description: Управление доступными услугами
  - name: Availability
    description: Проверка доступности услуг

paths:
  /contracts:
    post:
      tags: [Contracts]
      summary: Создать договор для компании
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Договор создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: У компании уже есть активный договор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/sign_contract:
    post:
      tags: [Contracts]
      operationId: sign_contract
      summary: Sign a contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignContractRequest"
      responses:
        "200":
          description: Contract signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignContractResponse"

  /contracts/{contractId}:
    get:
      tags: [Contracts]
      summary: Получить договор по идентификатору
      operationId: getContract
      parameters:
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Договор найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies/{companyId}/contract:
    get:
      tags: [Contracts]
      summary: Получить активный договор компании
      operationId: getActiveContract
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Активный договор найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '404':
          description: Активный договор отсутствует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{contractId}/status:
    patch:
      tags: [Contracts]
      summary: Изменить статус договора
      operationId: changeContractStatus
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      responses:
        '200':
          description: Статус изменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Изменение статуса нарушает бизнес-правила
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{contractId}/services:
    put:
      tags: [Services]
      summary: Добавить или обновить список доступных услуг
      operationId: updateContractServices
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServicesRequest'
      responses:
        '200':
          description: Список услуг обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies/{companyId}/services/{service}/availability:
    get:
      tags: [Availability]
      summary: Проверить доступность услуги для компании
      operationId: checkServiceAvailability
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/Service'
      responses:
        '200':
          description: Результат бизнес-проверки доступности услуги
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    ContractId:
      name: contractId
      in: path
      required: true
      description: Идентификатор договора
      schema:
        type: string
        format: uuid

    CompanyId:
      name: companyId
      in: path
      required: true
      description: Идентификатор компании
      schema:
        type: string
        format: uuid

    Service:
      name: service
      in: path
      required: true
      description: Услуга, доступность которой необходимо проверить
      schema:
        $ref: '#/components/schemas/ServiceType'

  schemas:
    ContractResponse:
      type: object
      required:
        - id
        - companyId
        - status
        - validFrom
        - validTo
        - services
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        services:
          type: array
          items:
            $ref: '#/components/schemas/ContractService'

    CreateContractRequest:
      type: object
      required:
        - companyId
        - validFrom
        - validTo
      properties:
        companyId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        services:
          type: array
          items:
            $ref: '#/components/schemas/ContractServiceInput'

    SignContractRequest:
      type: object
      required:
        - contractId
      properties:
        contractId:
          type: string
          format: uuid
          description: Идентификатор контракта

    ChangeStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ContractStatus'

    UpdateServicesRequest:
      type: object
      required:
        - services
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ContractServiceInput'

    ContractService:
      type: object
      required:
        - service
        - enabled
      properties:
        service:
          $ref: '#/components/schemas/ServiceType'
        enabled:
          type: boolean

    ContractServiceInput:
      type: object
      required:
        - service
        - enabled
      properties:
        service:
          $ref: '#/components/schemas/ServiceType'
        enabled:
          type: boolean

    AvailabilityResponse:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          description: Причина отказа, если услуга недоступна

    CreateContractResponse:
      type: object
      required:
        - id
        - companyId
        - status
        - validFrom
        - validTo
        - services
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        services:
          type: array
          items:
            $ref: '#/components/schemas/ContractService'
        createdAt:
          type: string
          format: date-time
          description: Дата и время создания

    SignContractResponse:
      type: object
      required:
        - id
        - companyId
        - userId
        - status
        - validFrom
        - validTo
        - services
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        services:
          type: array
          items:
            $ref: '#/components/schemas/ContractService'

    ContractStatus:
      type: string
      enum:
        - draft
        - active
        - suspended
        - terminated

    ServiceType:
      type: string
      enum:
        - trip_creation
        - trip_publish
        - trip_start
        - trip_participants
        - notifications
        - premium_support

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
